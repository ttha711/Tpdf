name: PDF Editor Package
on:
  push:
    branches:
      - feat/pdf-editor-react-library
    tags:
      - 'pdf-editor-v*'
  pull_request:
    paths:
      - 'packages/pdf-editor/**'
      - 'examples/next-host/**'
      - 'docs/PDF_EDITOR_PACKAGE.md'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    outputs:
      gzip_kib: ${{ steps.sizes.outputs.gzip_kib }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install monorepo dependencies (no Electron postinstall)
        run: npm ci --ignore-scripts
      - name: Build library, type declarations, size budget
        run: npm run build --workspace=@tpdf/pdf-editor
      - name: Run deterministic offline package tests
        run: npm test --workspace=@tpdf/pdf-editor
      - name: Record actual externalized JavaScript gzip size
        id: sizes
        run: echo "gzip_kib=$(node -p 'require("./packages/pdf-editor/dist/size-report.json").gzipJsKiB')" >> "$GITHUB_OUTPUT"
      - name: Install jsdom for optional DOM event test
        run: npm install --no-save --legacy-peer-deps --package-lock=false jsdom@25
        continue-on-error: true
      - name: Run jsdom event regression
        run: node --test packages/pdf-editor/tests/events-jsdom.test.mjs
      - name: Create npm tarball
        run: |
          mkdir -p release
          npm pack --workspace=@tpdf/pdf-editor --pack-destination release
          tar -tzf release/*.tgz | grep 'package/dist/index.d.ts'
          tar -tzf release/*.tgz | grep 'package/dist/style.css'
          cat packages/pdf-editor/dist/size-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: tpdf-pdf-editor-tarball
          path: release/*.tgz
      - name: Publish GitHub tag release (package tarball, not npm publish)
        if: startsWith(github.ref, 'refs/tags/pdf-editor-v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tgz

  size-report:
    name: "Externalized JS gzip ${{ needs.package.outputs.gzip_kib }} KiB"
    needs: package
    runs-on: ubuntu-latest
    steps:
      - run: echo "Read package job output for exact measured JS-only gzip."
  next-host-e2e:
    name: Next 14 host Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace=@tpdf/pdf-editor
      - run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: Install Next host
        working-directory: examples/next-host
        run: pnpm install --no-frozen-lockfile
      - name: Chromium dependencies
        working-directory: examples/next-host
        run: pnpm exec playwright install --with-deps chromium
      - name: Run real editor interaction tests
        working-directory: examples/next-host
        run: pnpm exec playwright test --reporter=line
